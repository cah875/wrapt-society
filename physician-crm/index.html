<style>
  /* ---------- Northwest Specialty Hospital brand ---------- */
  :root {
    --green: #3E9D46;  --green-dark: #2f7f36; --green-soft: #e8f4e9;
    --teal: #146D8D;   --teal-dark: #0f5670;  --teal-soft: #e3eff4;
    --brown: #714F39;  --brown-soft: #f2ece8;
    --text: #333333;   --text-2: #4a4a4a;     --muted: #6a6f6a;
    --bg: #f4f5f3;     --surface: #ffffff;    --surface-2: #f7f8f6;   --border: #d8dcd6;
    --red: #b93a2f;    --red-soft: #fbeae8;
    --amber: #9a6410;  --amber-soft: #fdf1dc;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.05);
    --font: "Open Sans", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: var(--teal); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 28px; font-weight: 700; margin: 0; line-height: 1.2; }
  h2 { font-size: 18px; font-weight: 700; margin: 0 0 12px; }
  h3 { font-size: 16px; font-weight: 700; margin: 0 0 8px; }
  p { margin: 0 0 10px; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .nowrap { white-space: nowrap; }
  .lead { color: var(--muted); font-size: 16px; margin: 4px 0 0; }
  :focus-visible { outline: 3px solid #8cc7ff; outline-offset: 2px; }

  svg.i { width: 20px; height: 20px; flex: none; vertical-align: -4px; }
  svg.i.sm { width: 16px; height: 16px; vertical-align: -3px; }

  /* ---------- Login ---------- */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); }
  .login-card { background: var(--surface); width: 100%; max-width: 440px; border-radius: 14px; padding: 36px 32px 28px; box-shadow: 0 10px 40px rgba(0,0,0,.10); border-top: 6px solid var(--green); }
  .login-card .logo { width: 100%; max-width: 330px; display: block; margin: 0 auto 26px; }
  .login-card h1 { font-size: 22px; text-align: center; }
  .login-card .lead { text-align: center; margin-bottom: 22px; }
  .login-error { color: var(--red); background: var(--red-soft); padding: 10px 12px; border-radius: 8px; margin-bottom: 4px; font-weight: 600; }
  .login-foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 22px; }
  .stripe { height: 5px; background: linear-gradient(90deg, var(--green) 0 33.3%, var(--brown) 33.3% 66.6%, var(--teal) 66.6%); }

  /* ---------- Header ---------- */
  .topbar { background: var(--surface); position: sticky; top: 0; z-index: 20; box-shadow: 0 1px 0 var(--border), 0 2px 8px rgba(0,0,0,.04); }
  .topbar-inner { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 72px; }
  .brand img { height: 46px; width: auto; display: block; }
  .nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; height: 100%; }
  .nav a { color: var(--text-2); padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-weight: 600; font-size: 16px; border-bottom: 4px solid transparent; border-top: 4px solid transparent; }
  .nav a:hover { color: var(--green-dark); text-decoration: none; }
  .nav a.active { color: var(--green-dark); border-bottom-color: var(--green); }
  .nav .count { background: var(--red); color: #fff; font-size: 12px; font-weight: 700; border-radius: 10px; padding: 1px 7px; }
  .userbox { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .userbox .who { color: var(--muted); font-size: 14px; margin-right: 6px; }
  @media (max-width: 860px) {
    .topbar-inner { flex-wrap: wrap; height: auto; padding: 10px 16px 0; gap: 8px 12px; }
    .brand { flex: 1; } .brand img { height: 38px; }
    .nav { order: 3; flex-basis: 100%; height: 48px; }
    .nav a { padding: 0 10px; font-size: 15px; }
    .userbox .who { display: none; }
  }
  @media (max-width: 480px) {
    .nav { justify-content: space-between; gap: 0; }
    .nav a { padding: 0 6px; font-size: 14px; gap: 5px; }
    .nav a svg { display: none; }
    .userbox .btn span { display: none; }
  }

  main { max-width: 1320px; margin: 0 auto; padding: 24px 20px 72px; }
  @media (max-width: 640px) { main { padding: 16px 16px 60px; } h1 { font-size: 24px; } }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .page-head .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .back { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; margin-bottom: 12px; }

  /* ---------- Cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
  .card + .card { margin-top: 18px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .card-head h2 { margin: 0; }
  .card-head .hint { color: var(--muted); font-size: 14px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; }
  .detail-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; margin-top: 18px; align-items: start; }
  .grid2 > *, .detail-grid > * { min-width: 0; }
  @media (max-width: 980px) { .grid2, .detail-grid { grid-template-columns: minmax(0, 1fr); } }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); color: inherit; display: block; }
  .kpi .label { color: var(--muted); font-size: 13px; font-weight: 600; }
  .kpi .value { font-size: 30px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
  .kpi.red .value { color: var(--red); }
  .kpi.green .value { color: var(--green-dark); }
  a.kpi:hover { text-decoration: none; border-color: var(--green); }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; line-height: 1.4; }
  .b-a { background: #eceeea; color: #4a4a4a; }
  .b-ref { background: var(--brown-soft); color: var(--brown); }
  .b-b { background: var(--amber-soft); color: var(--amber); }
  .b-c { background: var(--teal-soft); color: var(--teal); }
  .b-d { background: var(--green-soft); color: var(--green-dark); }
  .b-over { background: var(--red-soft); color: var(--red); }
  .b-soon { background: var(--amber-soft); color: var(--amber); }
  .b-later { background: var(--teal-soft); color: var(--teal); }
  .b-done { background: var(--green-soft); color: var(--green-dark); }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text);
    min-height: 44px; padding: 8px 18px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; line-height: 1.2; }
  .btn:hover { background: var(--surface-2); border-color: #bfc4bd; text-decoration: none; }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.primary:hover { background: var(--green-dark); border-color: var(--green-dark); }
  .btn.danger { color: var(--red); border-color: #e7c2bd; }
  .btn.danger:hover { background: var(--red-soft); }
  .btn.lg { min-height: 54px; font-size: 18px; padding: 10px 24px; }
  .btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }
  .btn.link { border: 0; background: none; padding: 0; min-height: 0; color: var(--teal); font-weight: 600; }
  .btn.link:hover { text-decoration: underline; background: none; }
  .btn.link.danger { color: var(--red); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .55; cursor: default; }
  @media (max-width: 640px) { .btn { white-space: normal; } }

  /* ---------- Forms ---------- */
  .form { display: grid; gap: 16px; }
  .form label, .field { display: grid; gap: 6px; }
  .field-label, .form label > span:first-child { font-size: 15px; font-weight: 700; color: var(--text); }
  .help { font-size: 14px; color: var(--muted); font-weight: 400; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1.5px solid #c4c9c2; border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0; min-height: 46px; }
  input:focus, select:focus, textarea:focus { outline: 3px solid #cfe6d1; border-color: var(--green); }
  textarea { resize: vertical; line-height: 1.5; }
  input[type=file] { padding: 8px; background: var(--surface-2); }
  input[type=checkbox] { width: 20px; height: 20px; min-height: 0; margin: 0; accent-color: var(--green); }
  .check { display: flex !important; align-items: center; gap: 10px; font-weight: 400 !important; font-size: 15px; cursor: pointer; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 640px) { .row2, .row3 { grid-template-columns: 1fr; } }
  fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 16px; margin: 0; min-width: 0; }
  legend { font-size: 14px; font-weight: 700; color: var(--green-dark); padding: 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .req::after { content: " *"; color: var(--red); }
  .stepnum { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: #fff; font-size: 14px; font-weight: 700; margin-right: 8px; vertical-align: -6px; }

  .choice { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border: 0; padding: 0; margin: 0; }
  @media (max-width: 640px) { .choice { grid-template-columns: 1fr 1fr; } }
  .choice label { display: block; }
  .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .choice span { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 8px 10px; border: 2px solid #c4c9c2; border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--text); background: var(--surface); text-align: center; }
  .choice span:hover { border-color: var(--green); }
  .choice input:checked + span { background: var(--green-soft); border-color: var(--green); color: var(--green-dark); }
  .choice input:focus-visible + span { outline: 3px solid #8cc7ff; outline-offset: 2px; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
  .quick .btn { min-height: 36px; padding: 4px 12px; font-size: 14px; }
  .radio-list { display: grid; gap: 8px; }
  .radio-list label { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px; cursor: pointer; }
  .radio-list label:hover { border-color: var(--green); }
  .radio-list input { width: 20px; height: 20px; min-height: 0; margin-top: 2px; accent-color: var(--green); flex: none; }
  .radio-list b { display: block; }
  .radio-list .small { display: block; }

  /* ---------- Search & filters ---------- */
  .search { position: relative; flex: 1 1 320px; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input { padding-left: 44px; min-height: 50px; font-size: 17px; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: end; }
  .filters .field { flex: 0 1 auto; }
  .filters .field select, .filters .field input { width: auto; min-width: 180px; }
  .filters .field-label { font-size: 13px; color: var(--muted); }

  /* ---------- Tables ---------- */
  .table-wrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 700; background: var(--surface-2); white-space: nowrap; text-transform: uppercase; letter-spacing: .03em; }
  tbody tr:hover { background: var(--surface-2); }
  tr.clickable { cursor: pointer; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td .primary-text { font-weight: 700; font-size: 16px; }
  td .sub { color: var(--muted); font-size: 14px; }
  .count-line { color: var(--muted); font-size: 14px; margin: 10px 0 0; }

  /* ---------- Progress ---------- */
  .bar { height: 10px; background: #e6e9e4; border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--green); border-radius: 999px; }
  .bar.teal > i { background: var(--teal); }
  .metric { margin-bottom: 16px; }
  .metric .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 8px; }
  .metric .top b { font-size: 20px; }
  .pipe-row { display: grid; grid-template-columns: 220px 1fr 44px; gap: 12px; align-items: center; padding: 8px 6px; color: inherit; border-radius: 6px; }
  .pipe-row:hover { text-decoration: none; background: var(--surface-2); }
  .pipe-row b { text-align: right; }
  @media (max-width: 640px) { .pipe-row { grid-template-columns: 1fr 70px 36px; } }

  /* ---------- Status steps ---------- */
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 6px 0 18px; }
  @media (max-width: 760px) { .steps { grid-template-columns: 1fr 1fr; gap: 10px 0; } }
  .step { text-align: center; padding: 0 6px; position: relative; }
  .step .circle { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #c9cec7; background: var(--surface); margin: 0 auto 8px; display: grid; place-items: center; font-weight: 700; color: var(--muted); position: relative; z-index: 1; }
  .step::before { content: ""; position: absolute; top: 20px; left: 0; right: 0; height: 3px; background: #c9cec7; }
  .step:first-child::before { left: 50%; } .step:last-child::before { right: 50%; }
  @media (max-width: 760px) { .step::before { display: none; } }
  .step .t { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .step .d { font-size: 13px; color: var(--muted); }
  .step.done .circle { background: var(--green); border-color: var(--green); color: #fff; }
  .step.done::before { background: var(--green); }
  .step.current .circle { border-color: var(--green); color: var(--green-dark); box-shadow: 0 0 0 4px var(--green-soft); }
  .step.current .t { color: var(--green-dark); }
  .status-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* ---------- Profile ---------- */
  .phys-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 20px; flex: none; }
  .phys-head .info { flex: 1; min-width: 220px; }
  .phys-head .info .sub { color: var(--muted); font-size: 16px; }
  .dl { display: grid; grid-template-columns: 150px 1fr; gap: 8px 14px; margin: 0; }
  .dl dt { color: var(--muted); font-size: 14px; font-weight: 600; padding-top: 2px; }
  .dl dd { margin: 0; overflow-wrap: anywhere; }
  @media (max-width: 480px) { .dl { grid-template-columns: 1fr; gap: 2px; } .dl dd { margin-bottom: 8px; } }
  .section-label { font-size: 13px; font-weight: 700; color: var(--green-dark); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 10px; padding-top: 14px; border-top: 1px solid var(--border); }
  .section-label.first { border-top: 0; padding-top: 0; margin-top: 0; }

  /* ---------- Timeline ---------- */
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline > li { border: 1px solid var(--border); border-left: 5px solid var(--teal); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; background: var(--surface); }
  .timeline .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 15px; }
  .timeline .meta .method { font-weight: 700; display: inline-flex; align-items: center; gap: 6px; color: var(--teal); }
  .timeline .body { margin: 10px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .timeline .ask { margin-top: 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
  .timeline .files { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .file-chip { display: inline-flex; gap: 6px; align-items: center; border: 1.5px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 14px; background: var(--surface-2); cursor: pointer; color: var(--teal); font-family: inherit; font-weight: 600; }
  .file-chip:hover { border-color: var(--teal); }
  .timeline .foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }

  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .list li:last-child { border-bottom: 0; }
  .list .grow { flex: 1; min-width: 0; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: 16px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; border-bottom: 2px solid var(--border); }
  .tabs button { border: 0; background: none; padding: 10px 14px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 4px solid transparent; margin-bottom: -2px; font-size: 16px; }
  .tabs button.on { color: var(--green-dark); border-bottom-color: var(--green); }
  .tabs button:hover { color: var(--text); }
  .toggle { display: inline-flex; border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden; }
  .toggle button { border: 0; background: var(--surface); padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; color: var(--muted); min-height: 44px; }
  .toggle button.on { background: var(--teal); color: #fff; }

  .notice { background: var(--amber-soft); border: 1px solid #ecd6a6; color: #6b4708; border-radius: 8px; padding: 12px 14px; font-size: 15px; display: flex; gap: 10px; align-items: flex-start; }
  .notice.info { background: var(--teal-soft); border-color: #bcd6e2; color: #10465b; }
  .notice svg { flex: none; margin-top: 2px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  .hash-out { word-break: break-all; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .welcome { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .quick-actions { display: flex; gap: 12px; flex-wrap: wrap; }

  /* ---------- Modal & toast ---------- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(30, 40, 30, .55); z-index: 50; display: grid; place-items: start center; overflow-y: auto; padding: 40px 16px; }
  .modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 780px; box-shadow: 0 20px 60px rgba(0,0,0,.3); border-top: 6px solid var(--green); }
  .modal.narrow { max-width: 520px; }
  .modal header { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; border-bottom: 1px solid var(--border); gap: 12px; }
  .modal header h2 { margin: 0; font-size: 20px; }
  .modal .x { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 6px; border-radius: 6px; }
  .modal .x:hover { background: var(--surface-2); color: var(--text); }
  .modal .content { padding: 22px; }
  .modal footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 12px 12px; flex-wrap: wrap; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; width: max-content; max-width: calc(100vw - 32px); }
  .toast { background: #2b2f2b; color: #fff; padding: 12px 18px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-weight: 600; display: flex; gap: 10px; align-items: center; }
  .toast.ok { background: var(--green-dark); }
  .toast.err { background: var(--red); }

  @media print {
    .topbar, .stripe, .no-print, form, .btn, .tabs, .filters { display: none !important; }
    body { background: #fff; font-size: 13px; }
    main { padding: 0; max-width: none; }
    .card { box-shadow: none; break-inside: avoid; }
    .detail-grid { grid-template-columns: 1fr 1fr; }
    .print-logo { display: block !important; height: 40px; margin-bottom: 16px; }
  }
  .print-logo { display: none; }
</style>
</head>

/* ===================== Utilities ===================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = (name, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#${name}"/></svg>`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const nowISO = () => new Date().toISOString();
function todayISO() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function addDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
function fmtDate(iso) { if (!iso) return '—'; const d = new Date(iso.length === 10 ? iso + 'T00:00:00' : iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
function fmtTS(ts) { if (!ts) return '—'; return new Date(ts).toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); }
function fmtSize(b) { return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }
function pct(a, g) { return g > 0 ? Math.round((a / g) * 100) : null; }
function fmtNum(n) { return (Math.round(n * 10) / 10).toLocaleString(); }
function initials(p) { return (((p.firstName || '')[0] || '') + ((p.lastName || '')[0] || '')).toUpperCase(); }
function physName(p) { return `Dr. ${p.firstName || ''} ${p.lastName || ''}`.replace(/\s+/g, ' ').trim() + (p.credentials ? `, ${p.credentials}` : ''); }
function physSortName(p) { return `${p.lastName || ''}, ${p.firstName || ''}`; }
function telLink(v) { return v ? `<a href="tel:${esc(v.replace(/[^\d+]/g, ''))}">${esc(v)}</a>` : '<span class="muted">—</span>'; }
function mailLink(v) { return v ? `<a href="mailto:${esc(v)}">${esc(v)}</a>` : '<span class="muted">—</span>'; }
function orDash(v) { return v ? esc(v) : '<span class="muted">—</span>'; }
function firstName(n) { return String(n || '').split(' ')[0]; }
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }

// SHA-256 (pure JS, so login also works when opened from a local file)
function sha256(str) {
  const bytes = Array.from(new TextEncoder().encode(str));
  const K = [], H = [];
  let n = 2, c = 0;
  const isPrime = (p) => { for (let f = 2; f * f <= p; f++) if (p % f === 0) return false; return true; };
  const frac = (x) => ((x - Math.floor(x)) * 4294967296) | 0;
  while (c < 64) { if (isPrime(n)) { if (c < 8) H[c] = frac(Math.pow(n, 1 / 2)); K[c] = frac(Math.pow(n, 1 / 3)); c++; } n++; }
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  const hi = Math.floor(bitLen / 4294967296);
  for (let i = 3; i >= 0; i--) bytes.push((hi >>> (i * 8)) & 255);
  for (let i = 3; i >= 0; i--) bytes.push((bitLen >>> (i * 8)) & 255);
  const rotr = (x, r) => (x >>> r) | (x << (32 - r));
  const w = new Array(64);
  for (let o = 0; o < bytes.length; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = (bytes[o + i * 4] << 24) | (bytes[o + i * 4 + 1] << 16) | (bytes[o + i * 4 + 2] << 8) | bytes[o + i * 4 + 3];
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, cc, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + cc) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map((x) => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'ok');
  el.innerHTML = ico(kind === 'err' ? 'i-alert' : 'i-check') + esc(msg);
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), kind === 'err' ? 6000 : 2800);
}

function download(filename, content, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: type || 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function toCSV(rows) {
  return rows.map((r) => r.map((v) => {
    const s = String(v ?? '');
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(',')).join('\r\n');
}

/* ===================== Data storage =====================
   Records live in localStorage; attachments live in IndexedDB.
   Both stay in this browser only — use Settings → Backup to
   move or share data.                                        */
let db;

function emptyDB() {
  return {
    version: 1,
    settings: {
      team: CONFIG.users.filter((u) => u.team !== false).map((u) => u.name),
      specialties: DEFAULT_SPECIALTIES.slice(),
    },
    physicians: [],
    contacts: [],
    meta: { createdAt: nowISO(), updatedAt: nowISO() },
  };
}

function loadDB() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      const base = emptyDB();
      d.settings = Object.assign(base.settings, d.settings || {});
      d.physicians = d.physicians || [];
      d.contacts = d.contacts || [];
      d.meta = d.meta || base.meta;
      return d;
    }
  } catch (e) { console.error(e); }
  return emptyDB();
}

function saveDB() {
  db.meta.updatedAt = nowISO();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); return true; }
  catch (e) { toast('Could not save — browser storage is full. Export a backup and remove old attachments.', 'err'); return false; }
}

const Files = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('nwsh-pr-files', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('files');
      req.onsuccess = () => { this._db = req.result; resolve(this._db); };
      req.onerror = () => reject(req.error);
    });
  },
  async tx(mode, fn) {
    const d = await this.open();
    return new Promise((resolve, reject) => {
      const t = d.transaction('files', mode);
      const req = fn(t.objectStore('files'));
      t.oncomplete = () => resolve(req && req.result);
      t.onerror = () => reject(t.error);
    });
  },
  put(id, blob) { return this.tx('readwrite', (s) => s.put(blob, id)); },
  get(id) { return this.tx('readonly', (s) => s.get(id)); },
  del(id) { return this.tx('readwrite', (s) => s.delete(id)); },
  clear() { return this.tx('readwrite', (s) => s.clear()); },
};

/* ===================== Auth ===================== */
let session = null;

function getSession() {
  try {
    const s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
    if (!s) return null;
    const user = CONFIG.users.find((u) => u.username === s.username);
    if (!user) return null;
    if (Date.now() - s.lastActive > CONFIG.idleMinutes * 60000) { sessionStorage.removeItem(SESSION_KEY); return null; }
    return { ...s, name: user.name, role: user.role };
  } catch { return null; }
}
function touchSession() {
  if (!session) return;
  session.lastActive = Date.now();
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username: session.username, lastActive: session.lastActive })); } catch {}
}
function isAdmin() { return session && session.role === 'admin'; }

function showLogin(msg) {
  session = null;
  $('#app').hidden = true;
  $('#login').hidden = false;
  closeModal();
  const err = $('#login-error');
  err.hidden = !msg; err.textContent = msg || '';
  $('#login-form').reset();
  $('#login-form [name=password]').type = 'password';
  setTimeout(() => $('#login-form [name=username]').focus(), 0);
}
function showApp() {
  $('#login').hidden = true;
  $('#app').hidden = false;
  $('#user-name').textContent = session.name;
  if (!location.hash || location.hash === '#' || location.hash === '#/') location.hash = '#/home';
  else route();
}
function logout(msg) {
  try { sessionStorage.removeItem(SESSION_KEY); } catch {}
  location.hash = '#/home';
  showLogin(msg);
}

$('#show-pw').addEventListener('change', (e) => { $('#login-form [name=password]').type = e.target.checked ? 'text' : 'password'; });
$('#login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  const lockUntil = +(sessionStorage.getItem('nwsh.pr.lock') || 0);
  if (Date.now() < lockUntil) { showLoginError(`Too many attempts. Please wait ${Math.ceil((lockUntil - Date.now()) / 1000)} seconds and try again.`); return; }
  const username = f.username.value.trim().toLowerCase();
  const user = CONFIG.users.find((u) => u.username.toLowerCase() === username);
  if (user && sha256(`${user.username}:${f.password.value}`) === user.hash) {
    sessionStorage.removeItem('nwsh.pr.fails');
    session = { username: user.username, name: user.name, role: user.role, lastActive: Date.now() };
    touchSession();
    showApp();
  } else {
    const fails = +(sessionStorage.getItem('nwsh.pr.fails') || 0) + 1;
    sessionStorage.setItem('nwsh.pr.fails', fails);
    if (fails >= 5) { sessionStorage.setItem('nwsh.pr.lock', Date.now() + 60000); sessionStorage.setItem('nwsh.pr.fails', 0); }
    showLoginError('That username or password is not correct. Please try again.');
    f.password.value = '';
    f.password.focus();
  }
});
function showLoginError(m) { const el = $('#login-error'); el.textContent = m; el.hidden = false; }

['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach((ev) => document.addEventListener(ev, () => {

const contactsFor = (pid) => db.contacts.filter((c) => c.physicianId === pid).sort(byContactDesc);

function nextFU(pid) {

}
function fuState(c) {
  if (c.fuDone) return 'done';

}

  return `<span class="badge b-${st}">${txt}</span>`;
}
function stageIndex(p) { return Math.max(0, STAGES.findIndex((s) => s.key === p.stage)); }
function stageLabelFor(stage, relType) {
  if (stage === 'a' || !stage) return relType === 'referrer' ? 'Referrer' : 'Prospect';
  return (STAGES.find((x) => x.key === stage) || {}).label || stage;

function stageBadge(p) {

}
function goalRow(p, year) { return (p.goals || []).find((g) => String(g.year) === String(year)); }

          const h = (p.stageHistory || []).filter((x) => x.stage === s.key && !x.typeChange).slice(-1)[0];

            <div class="circle">${i < idx ? ico('i-check') : i + 1}</div>

        </section>
      </div>
    </div>`;
}

function goalsTableHTML(p) {
  const goals = (p.goals || []).slice().sort((a, b) => num(b.year) - num(a.year));
  if (!goals.length) return `<p class="empty">No goals entered yet. Click <b>Add a year</b> to set surgical and ancillary goals.</p>`;
  const cell = (a, gl) => {
    const hasA = a !== '' && a !== undefined && a !== null, hasG = gl !== '' && gl !== undefined && gl !== null;
    if (!hasA && !hasG) return '<span class="muted">Not set</span>';
    const v = pct(num(a), num(gl));
    const color = v === null ? 'inherit' : v >= 100 ? 'var(--green-dark)' : v >= 75 ? 'var(--amber)' : 'var(--red)';
    return `<b>${fmtNum(num(a))}</b> <span class="muted">of ${hasG ? fmtNum(num(gl)) : '—'}</span>${v === null ? '' : ` <b style="color:${color}">${v}%</b>`}`;
  };
  return `<div class="table-wrap"><table>
    <thead><tr><th>Year</th><th>Surgeries</th><th>Ancillary</th><th class="no-print"></th></tr></thead>
    <tbody>${goals.map((g) => `<tr>
      <td><b>${esc(g.year)}</b></td>
      <td class="nowrap">${cell(g.surgActual, g.surgGoal)}</td>
      <td class="nowrap">${cell(g.ancActual, g.ancGoal)}</td>
      <td class="no-print nowrap" style="text-align:right"><button class="btn sm" data-act="edit-goal" data-pid="${p.id}" data-gid="${g.id}">${ico('i-edit', 'sm')}Update</button></td>
    </tr>`).join('')}</tbody>
  </table></div>
  <p class="small muted" style="margin:10px 0 0">Ancillary = imaging, lab, therapy and other non-surgical referrals.</p>`;
}

function goalFormHTML(g) {
  const v = (k) => esc(g[k] ?? '');
  return `<form class="form" data-form="goal" data-gid="${g.id || ''}" id="goal-form">
    <label><span class="req">Year</span><input type="number" name="year" min="2000" max="2100" required value="${v('year')}" style="max-width:160px"></label>
    <fieldset><legend>Surgeries</legend><div class="row2">
      <label><span>Goal</span><input type="number" name="surgGoal" min="0" step="1" inputmode="numeric" value="${v('surgGoal')}" placeholder="0"></label>
      <label><span>Actual so far</span><input type="number" name="surgActual" min="0" step="1" inputmode="numeric" value="${v('surgActual')}" placeholder="0"></label>
    </div></fieldset>
    <fieldset><legend>Ancillary</legend><div class="row2">
      <label><span>Goal</span><input type="number" name="ancGoal" min="0" step="1" inputmode="numeric" value="${v('ancGoal')}" placeholder="0"></label>
      <label><span>Actual so far</span><input type="number" name="ancActual" min="0" step="1" inputmode="numeric" value="${v('ancActual')}" placeholder="0"></label>
    </div></fieldset>
  </form>`;
}

function contactFormHTML(pid, c) {
  const team = db.settings.team.slice();
  const who = c ? c.who : (team.includes(session.name) ? session.name : team[0]);
  if (who && !team.includes(who)) team.push(who);
  const method = c ? c.method : '';
  const fid = c ? 'edit' : 'new';
  return `<form class="form" data-form="contact" data-pid="${pid}" data-cid="${c ? c.id : ''}">
    <div class="row2">
      <label><span class="req">Date of contact</span><input type="date" name="date" required value="${esc(c ? c.date : todayISO())}"></label>
      <label><span class="req"><span class="stepnum">1</span>Who made the contact?</span><select name="who" required>${team.map((n) => `<option ${n === who ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
    </div>
    <div class="field">
      <span class="field-label req"><span class="stepnum">2</span>How did you contact them?</span>
      <fieldset class="choice">
        ${METHODS.map((m) => `<label><input type="radio" name="method" value="${m}" ${m === method ? 'checked' : ''} required><span>${ico(METHOD_ICON[m])}${m}</span></label>`).join('')}
      </fieldset>
    </div>
    <label><span class="req"><span class="stepnum">3</span>What was communicated?</span><textarea name="comm" rows="4" required placeholder="A short summary of the conversation or message">${esc(c ? c.comm : '')}</textarea></label>
    <label><span>Attach a file <span class="help">(optional — up to ${CONFIG.maxFileMB} MB each)</span></span><input type="file" name="files" multiple>
      ${c && c.attachments && c.attachments.length ? `<span class="help">Already attached: ${c.attachments.map((a) => esc(a.name)).join(', ')}</span>` : ''}</label>
    <label><span><span class="stepnum">4</span>What did we ask for, or what happens next? <span class="help">(the "ask")</span></span><input name="ask" value="${esc(c ? c.ask : '')}" placeholder="Example: Return the credentialing packet, schedule a site tour…"></label>
    <div class="field">
      <label for="fu-${fid}-${pid}"><span><span class="stepnum">5</span>Follow-up date <span class="help">(optional — this adds it to the Follow-Ups list)</span></span></label>

function filteredActivity() {
  const f = ui.act, q = f.q.trim().toLowerCase();
  return db.contacts.filter((c) => {
    if (f.who && c.who !== f.who) return false;
    if (f.method && c.method !== f.method) return false;
    if (f.from && c.date < f.from) return false;
    if (f.to && c.date > f.to) return false;
    if (q) {
      const p = getPhys(c.physicianId);
      const hay = [c.comm, c.ask, c.who, p && physName(p), p && p.practice].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort(byContactDesc);
}

/* ===================== Mutations ===================== */
function savePhysicianFromForm(form) {
  if (!form.reportValidity()) return false;
  const data = Object.fromEntries(new FormData(form).entries());
  Object.keys(data).forEach((k) => (data[k] = String(data[k]).trim()));
  if (data.state) data.state = data.state.toUpperCase();
  const id = form.dataset.id;
  if (id) {
    Object.assign(getPhys(id), data, { updatedAt: nowISO(), updatedBy: session.name });
    saveDB(); toast('Details saved'); rerender();
  } else {
    const dupe = db.physicians.find((x) => (x.npi && data.npi && x.npi === data.npi) ||
      (x.firstName.toLowerCase() === data.firstName.toLowerCase() && x.lastName.toLowerCase() === data.lastName.toLowerCase()));
    if (dupe && !confirm(`${physName(dupe)} is already in the list. Add this physician anyway?`)) return false;
    const stage = data.stage || 'a', relType = data.relType || 'prospect';
    const p = {
      id: uid(), ...data, stage, relType, goals: [],
      stageHistory: [{ stage, label: stageLabelFor(stage, relType), date: todayISO(), by: session.name }],
      createdAt: nowISO(), createdBy: session.name,
    };
    db.physicians.push(p);
    saveDB(); toast(`${physName(p)} added`);
    location.hash = '#/physician/' + p.id;
  }
  return true;
}

async function saveContactFromForm(form) {
  if (!form.reportValidity()) return false;
  const fd = new FormData(form);
  const files = fd.getAll('files').filter((f) => f && f.size);
  const tooBig = files.find((f) => f.size > CONFIG.maxFileMB * 1048576);
  if (tooBig) { toast(`"${tooBig.name}" is larger than ${CONFIG.maxFileMB} MB and cannot be attached.`, 'err'); return false; }
  const attachments = [];
  try {
    for (const f of files) { const id = uid(); await Files.put(id, f); attachments.push({ id, name: f.name, size: f.size, type: f.type }); }
  } catch (e) { toast('The attachment could not be saved: ' + (e && e.message ? e.message : e), 'err'); return false; }
  const fields = {
    date: fd.get('date'), who: fd.get('who'), method: fd.get('method'),
    comm: String(fd.get('comm') || '').trim(), ask: String(fd.get('ask') || '').trim(), fuDate: fd.get('fuDate') || '',
  };
  const cid = form.dataset.cid;
  if (cid) {
    const c = getContact(cid);
    if (c.fuDate !== fields.fuDate && fields.fuDate) { c.fuDone = false; c.fuDoneDate = ''; }
    Object.assign(c, fields, { attachments: [...(c.attachments || []), ...attachments], updatedAt: nowISO(), updatedBy: session.name });
    toast('Contact updated');
  } else {
    db.contacts.push({ id: uid(), physicianId: form.dataset.pid, ...fields, attachments, fuDone: false, createdAt: nowISO(), createdBy: session.name });
    toast('Contact saved' + (fields.fuDate ? ` — follow-up set for ${fmtDate(fields.fuDate)}` : ''));
  }
  saveDB(); rerender();
  return true;
}

function applyStage(p, stage, relType) {
  const changedType = relType && relType !== (p.relType || 'prospect');
  const changedStage = stage !== (p.stage || 'a');
  if (!changedType && !changedStage) return;
  p.stageHistory = p.stageHistory || [];
  if (changedType) { p.relType = relType; p.stageHistory.push({ stage: 'a', typeChange: true, label: 'Relationship set to ' + (relType === 'referrer' ? 'Referrer' : 'Prospect'), date: todayISO(), by: session.name }); }
  if (changedStage) { p.stage = stage; p.stageHistory.push({ stage, label: stageLabelFor(stage, p.relType), date: todayISO(), by: session.name }); }
  p.updatedAt = nowISO(); p.updatedBy = session.name;
  saveDB(); toast('Status updated: ' + stageLabelFor(p.stage, p.relType)); rerender();
}

function saveGoalFromForm(p, form) {
  if (!form.reportValidity()) return false;
  const d = Object.fromEntries(new FormData(form).entries());
  const clean = (v) => (v === '' ? '' : Math.max(0, num(v)));
  const rec = { year: +d.year, surgGoal: clean(d.surgGoal), surgActual: clean(d.surgActual), ancGoal: clean(d.ancGoal), ancActual: clean(d.ancActual) };
  p.goals = p.goals || [];
  const gid = form.dataset.gid;
  const clash = p.goals.find((g) => +g.year === rec.year && g.id !== gid);
  if (clash) { toast(`There is already a row for ${rec.year}. Update that one instead.`, 'err'); return false; }
  if (gid) Object.assign(p.goals.find((g) => g.id === gid), rec); else p.goals.push({ id: uid(), ...rec });
  p.updatedAt = nowISO(); p.updatedBy = session.name;
  saveDB(); toast(`${rec.year} goals saved`); rerender();
  return true;
}

async function exportBackup() {
  const files = {};
  for (const id of db.contacts.flatMap((c) => (c.attachments || []).map((a) => a.id))) {
    try { const blob = await Files.get(id); if (blob) files[id] = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); }); } catch {}
  }
  download(`physician-relations-backup-${todayISO()}.json`, JSON.stringify({ app: 'nwsh-physician-relations', exportedAt: nowISO(), exportedBy: session.name, db, files }), 'application/json');
  toast('Backup downloaded — keep it somewhere safe');
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast('That file is not a valid backup.', 'err'); return; }
  if (!data || !['nwsh-physician-relations', 'physician-crm'].includes(data.app) || !data.db) { toast('That file is not a Physician Relations backup.', 'err'); return; }
  confirmBox(`Replace everything in this browser with the backup from <b>${fmtTS(data.exportedAt)}</b> (${data.db.physicians.length} physicians, ${data.db.contacts.length} contacts)?`, async () => {
    try { await Files.clear(); for (const [id, url] of Object.entries(data.files || {})) await Files.put(id, await (await fetch(url)).blob()); }
    catch (e) { toast('Some attachments could not be restored.', 'err'); }
    localStorage.setItem(STORE_KEY, JSON.stringify(data.db));
    db = loadDB(); toast('Backup restored'); rerender();
  }, 'Replace my data', true);
}
function exportPhysCSV() {
  const y = new Date().getFullYear();
  const rows = [['Last Name', 'First Name', 'Credentials', 'NPI', 'Specialty', 'Practice', 'Address', 'City', 'State', 'ZIP', 'Office Phone', 'Cell', 'Fax', 'Email',
    'Practice Manager', 'PM Title', 'PM Phone', 'PM Email', 'Relationship', 'Status', 'Last Contact', 'Next Follow-Up',
    `${y} Surg Goal`, `${y} Surg Actual`, `${y} Ancillary Goal`, `${y} Ancillary Actual`, 'Notes']];
  db.physicians.slice().sort((a, b) => physSortName(a).localeCompare(physSortName(b))).forEach((p) => {
    const g = goalRow(p, y) || {}, lc = lastContact(p.id), nf = nextFU(p.id);
    rows.push([p.lastName, p.firstName, p.credentials, p.npi, p.specialty, p.practice, p.address, p.city, p.state, p.zip, p.phone, p.cell, p.fax, p.email,
      p.pmName, p.pmTitle, p.pmPhone, p.pmEmail, p.relType === 'referrer' ? 'Referrer' : 'Prospect', stageLabelFor(p.stage || 'a', p.relType),
      lc ? lc.date : '', nf ? nf.fuDate : '', g.surgGoal, g.surgActual, g.ancGoal, g.ancActual, p.notes]);
  });
  download(`physicians-${todayISO()}.csv`, '﻿' + toCSV(rows), 'text/csv');
}
function exportContactsCSV() {
  const list = location.hash.startsWith('#/activity') ? filteredActivity() : db.contacts.slice().sort(byContactDesc);
  const rows = [['Date', 'Physician', 'Practice', 'Who Contacted', 'How', 'What Was Communicated', 'Ask', 'Follow-Up Date', 'Follow-Up Done', 'Attachments', 'Logged By', 'Logged At']];
  list.forEach((c) => {
    const p = getPhys(c.physicianId);
    rows.push([c.date, p ? physName(p) : '', p ? p.practice : '', c.who, c.method, c.comm, c.ask, c.fuDate, c.fuDone ? 'Yes' : c.fuDate ? 'No' : '', (c.attachments || []).map((a) => a.name).join('; '), c.createdBy, c.createdAt]);
  });
  download(`activity-${todayISO()}.csv`, '﻿' + toCSV(rows), 'text/csv');
}

      goals: [{ id: uid(), year: y, surgGoal: 60, surgActual: 48, ancGoal: 150, ancActual: 161 }] }),

  db.contacts.push(

    C(P[0], -6, other, 'Email', 'Sent updated block schedule proposal and Q3 volume summary.', 'Confirm acceptance of new Thursday block', 3, false),
    C(P[1], -12, me, 'Phone Call', 'Spoke with practice manager. Dr. Chen is open to privileges for lap chole and hernia cases.', 'Return completed credentialing packet', -2, false),
    C(P[2], -3, other, 'Text', 'Intro text via mutual colleague; agreed to a meet-and-greet.', 'Schedule site tour', 5, false),
    C(P[3], -40, me, 'Email', 'Credentialing approved by MEC. Sent welcome letter.', 'Schedule orientation and EHR training', 14, false),
  );
  saveDB(); toast('Sample records loaded'); rerender();

/* ===================== Event delegation ===================== */
const actions = {
  logout: () => logout(),
  'go-search': () => { ui.phys.q = ''; setTimeout(() => { const s = $('#phys-search'); if (s) s.focus(); }, 50); },
  'add-physician': () => openModal({ title: 'Add a physician', body: physicianFormHTML(null), submitLabel: 'Add physician', onSubmit: () => savePhysicianFromForm($('#phys-form')) }),
  'edit-physician': (el) => { const p = getPhys(el.dataset.id); openModal({ title: 'Edit ' + physName(p), body: physicianFormHTML(p), submitLabel: 'Save changes', onSubmit: () => savePhysicianFromForm($('#phys-form')) }); },
  'delete-physician': (el) => {
    const p = getPhys(el.dataset.id);
    const cs = db.contacts.filter((c) => c.physicianId === p.id);
    confirmBox(`Permanently delete <b>${esc(physName(p))}</b> and ${cs.length} logged contact${cs.length === 1 ? '' : 's'}? This cannot be undone.`, async () => {
      for (const c of cs) for (const a of c.attachments || []) { try { await Files.del(a.id); } catch {} }
      db.contacts = db.contacts.filter((c) => c.physicianId !== p.id);
      db.physicians = db.physicians.filter((x) => x.id !== p.id);
      saveDB(); toast('Physician deleted'); location.hash = '#/physicians';
    }, 'Delete permanently', true);
  },
  'open-phys': (el, e) => { if (!e.target.closest('a, button, input')) location.hash = '#/physician/' + el.dataset.id; },
  'filter-phys': (el) => { Object.assign(ui.phys, { q: '', spec: '', stage: el.dataset.stage || '', type: el.dataset.type || '' }); },
  print: () => window.print(),
  'advance-stage': (el) => {
    const p = getPhys(el.dataset.id); const next = STAGES[stageIndex(p) + 1]; if (!next) return;
    confirmBox(`Move <b>${esc(physName(p))}</b> to <b>${esc(next.label)}</b>?<br><span class="small muted">${esc(next.desc)}</span>`, () => applyStage(p, next.key, p.relType), 'Yes, move to ' + next.short);
  },
  'change-stage': (el) => {
    const p = getPhys(el.dataset.id);
    openModal({ title: 'Change status — ' + physName(p), body: stageFormHTML(p), submitLabel: 'Save status', narrow: true, onSubmit: () => {
      const f = $('#stage-form'); applyStage(p, f.stage.value, f.relType.value); return true;
    } });
  },
  'toggle-hist': (el) => { const h = $('#stage-hist'); h.hidden = !h.hidden; el.textContent = (h.hidden ? 'Show' : 'Hide') + el.textContent.slice(4); },
  'add-goal': (el) => {
    const p = getPhys(el.dataset.id); p.goals = p.goals || [];
    const used = p.goals.map((g) => +g.year); let yr = new Date().getFullYear(); while (used.includes(yr)) yr++;
    openModal({ title: 'Add goals for a year', body: goalFormHTML({ year: yr }), submitLabel: 'Save goals', narrow: true, onSubmit: () => saveGoalFromForm(p, $('#goal-form')) });
  },
  'edit-goal': (el) => {
    const p = getPhys(el.dataset.pid); const g = p.goals.find((x) => x.id === el.dataset.gid);
    openModal({ title: `Update ${g.year} goals & actuals`, body: goalFormHTML(g) + `<div style="margin-top:14px"><button type="button" class="btn link danger" data-act="del-goal" data-pid="${p.id}" data-gid="${g.id}">Remove this year</button></div>`, submitLabel: 'Save', narrow: true, onSubmit: () => saveGoalFromForm(p, $('#goal-form')) });
  },
  'del-goal': (el) => {
    const p = getPhys(el.dataset.pid); const gid = el.dataset.gid; closeModal();
    confirmBox('Remove this year of goals and actuals?', () => { p.goals = p.goals.filter((g) => g.id !== gid); saveDB(); toast('Removed'); rerender(); }, 'Remove', true);
  },
  'fu-quick': (el) => {
    const form = el.closest('form'); const inp = form.querySelector('[name=fuDate]');
    const base = form.querySelector('[name=date]').value || todayISO();
    inp.value = el.dataset.days ? addDays(base, +el.dataset.days) : '';
  },
  'fu-done': (el) => { const c = getContact(el.dataset.id); c.fuDone = true; c.fuDoneDate = todayISO(); c.fuDoneBy = session.name; saveDB(); toast('Follow-up marked done'); rerender(); },
  'fu-reopen': (el) => { const c = getContact(el.dataset.id); c.fuDone = false; c.fuDoneDate = ''; c.fuDoneBy = ''; saveDB(); toast('Follow-up reopened'); rerender(); },
  'fu-log': (el) => {
    const c = getContact(el.dataset.id); const p = getPhys(c.physicianId);
    openModal({
      title: 'Log a contact — ' + physName(p),
      body: `<div class="notice info" style="margin-bottom:16px">${ico('i-info')}<div>Saving this will also mark the follow-up "<b>${esc(c.ask || 'from ' + fmtDate(c.date))}</b>" as done.</div></div>` + contactFormHTML(p.id, null).replace(/<div><button class="btn primary lg" type="submit">[\s\S]*?<\/button><\/div>/, ''),
      submitLabel: 'Save this contact',
      onSubmit: async () => {
        const ok = await saveContactFromForm($('#modal-root form'));
        if (ok) { c.fuDone = true; c.fuDoneDate = todayISO(); c.fuDoneBy = session.name; saveDB(); rerender(); }
        return ok;
      },
    });
  },
  'fu-tab': (el) => { ui.fu.tab = el.dataset.tab; rerender(); },
  'fu-mine': (el) => { ui.fu.mine = el.dataset.mine === '1'; rerender(); },
  'edit-contact': (el) => {
    const c = getContact(el.dataset.id);
    openModal({ title: 'Edit contact', body: contactFormHTML(c.physicianId, c), submitLabel: 'Save changes', onSubmit: () => saveContactFromForm($('#modal-root form')) });
  },
  'del-contact': (el) => {
    const c = getContact(el.dataset.id);
    confirmBox('Delete this contact entry and any attached files?', async () => {
      for (const a of c.attachments || []) { try { await Files.del(a.id); } catch {} }
      db.contacts = db.contacts.filter((x) => x.id !== c.id); saveDB(); toast('Contact deleted'); rerender();
    }, 'Delete', true);
  },
  'dl-file': async (el) => {
    try {
      const blob = await Files.get(el.dataset.fid);
      if (!blob) return toast('This file is not stored in this browser. It may have been attached on another computer.', 'err');
      download(el.dataset.name, blob);
    } catch (e) { toast('The file could not be opened.', 'err'); }
  },
  'load-sample': () => loadSample(),
  'export-json': () => exportBackup(),
  'import-json': () => $('#import-input').click(),
  'export-phys-csv': () => exportPhysCSV(),
  'export-contacts-csv': () => exportContactsCSV(),
  'clear-all': () => confirmBox('Erase <b>all</b> physicians, contacts and attachments stored in this browser? Export a backup first if you might need them.', async () => {
    try { await Files.clear(); } catch {}
    db = emptyDB(); saveDB(); toast('All data erased'); location.hash = '#/home'; rerender();
  }, 'Erase everything', true),
  'team-add': () => {
    const inp = $('#team-new'); const n = inp.value.trim(); if (!n) return;
    if (!db.settings.team.includes(n)) db.settings.team.push(n);
    saveDB(); toast('Added'); rerender();
  },
  'team-del': (el) => { db.settings.team.splice(+el.dataset.i, 1); saveDB(); rerender(); },
  'close-modal': () => closeModal(),
  'modal-bg': (el, e) => { if (e.target === el) closeModal(); },
  'modal-submit': async (el) => {
    const fn = $('#modal-root')._onSubmit; if (!fn) return;
    el.disabled = true;
    try { if ((await fn()) !== false) closeModal(); } finally { el.disabled = false; }
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'BUTTON' || el.getAttribute('role') === 'button') e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal();
});
document.addEventListener('submit', async (e) => {
  const form = e.target;
  const kind = form.dataset.form;
  if (!kind) return;
  e.preventDefault();
  if (kind === 'contact') {
    const btn = form.querySelector('[type=submit]'); if (btn) btn.disabled = true;
    try { await saveContactFromForm(form); } finally { if (btn) btn.disabled = false; }
  } else if (kind === 'physician') {
    if (savePhysicianFromForm(form)) closeModal();
  } else if (kind === 'goal') {
    const b = $('[data-act=modal-submit]'); if (b) b.click();
  } else if (kind === 'specialties') {
    db.settings.specialties = [...new Set(form.list.value.split('\n').map((s) => s.trim()).filter(Boolean))];
    saveDB(); toast('Specialty list saved');
  } else if (kind === 'hash') {
    const u = form.username.value, h = sha256(`${u}:${form.password.value}`);
    const out = $('#hash-out'); out.hidden = false;
    out.innerHTML = `<div class="small muted" style="font-family:var(--font)">Hash for <b>${esc(u)}</b> — paste this into CONFIG.users:</div>${h}`;
  }
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset.input;
  if (k === 'phys-q') { ui.phys.q = e.target.value; updatePhysTable(); }
  if (k === 'act-q') { ui.act.q = e.target.value; updateActivityTable(); }
});
document.addEventListener('change', (e) => {
  const t = e.target, k = t.dataset.change;
  if (!k) return;
  switch (k) {
    case 'phys-show': {
      const [kind, val] = t.value.split(':');
      ui.phys.stage = kind === 'stage' ? val : ''; ui.phys.type = kind === 'type' ? val : '';
      updatePhysTable(); break;
    }
    case 'phys-spec': ui.phys.spec = t.value; updatePhysTable(); break;
    case 'phys-sort': ui.phys.sort = t.value; updatePhysTable(); break;
    case 'act-who': ui.act.who = t.value; updateActivityTable(); break;
    case 'act-method': ui.act.method = t.value; updateActivityTable(); break;
    case 'act-from': ui.act.from = t.value; updateActivityTable(); break;
    case 'act-to': ui.act.to = t.value; updateActivityTable(); break;
    case 'dash-year': ui.year = +t.value; rerender(); break;
    case 'team-name': { const v = t.value.trim(); if (v) { db.settings.team[+t.dataset.i] = v; saveDB(); toast('Saved'); } break; }
  }
});
$('#import-input').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ''; });

// Keep multiple open tabs in sync
window.addEventListener('storage', (e) => { if (e.key === STORE_KEY && session) { db = loadDB(); rerender(); } });

/* ===================== Boot ===================== */
db = loadDB();
session = getSession();
if (session) { touchSession(); showApp(); } else showLogin();
</script>
